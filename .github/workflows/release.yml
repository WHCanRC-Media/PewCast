name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev
      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package binary
        run: |
          cp target/x86_64-unknown-linux-gnu/release/whcanrc-assisted-listening whcanrc-assisted-listening-linux-x86_64
          tar czf whcanrc-assisted-listening-linux-x86_64.tar.gz whcanrc-assisted-listening-linux-x86_64 config.toml.example
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            whcanrc-assisted-listening-linux-x86_64
            whcanrc-assisted-listening-linux-x86_64.tar.gz

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Rename binary
        run: |
          copy target\x86_64-pc-windows-msvc\release\whcanrc-assisted-listening.exe whcanrc-assisted-listening-windows-x86_64.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: whcanrc-assisted-listening-windows-x86_64.exe

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk whcanrc-assisted-listening-android.apk
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: whcanrc-assisted-listening-android.apk

  build-installer:
    name: Build NSIS Installer
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build installer
        run: makensis installer\installer.nsi
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-artifacts
          path: installer/whcanrc-assisted-listening-setup.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-installer, build-android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            whcanrc-assisted-listening-linux-x86_64
            whcanrc-assisted-listening-linux-x86_64.tar.gz
            whcanrc-assisted-listening-windows-x86_64.exe
            whcanrc-assisted-listening-setup.exe
            whcanrc-assisted-listening-android.apk
          generate_release_notes: true
