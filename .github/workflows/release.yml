name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev
      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package binary
        run: |
          cp target/x86_64-unknown-linux-gnu/release/pewcast pewcast-linux-x86_64
          tar czf pewcast-linux-x86_64.tar.gz pewcast-linux-x86_64 config.toml.example
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            pewcast-linux-x86_64
            pewcast-linux-x86_64.tar.gz

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Rename binary
        run: |
          copy target\x86_64-pc-windows-msvc\release\pewcast.exe pewcast-windows-x86_64.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: pewcast-windows-x86_64.exe

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "PEWCAST_KEYSTORE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          PEWCAST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEWCAST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEWCAST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pewcast-android.apk
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: pewcast-android.apk

  build-installer:
    name: Build NSIS Installer
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build installer
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer\installer.nsi'
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-artifacts
          path: installer/pewcast-setup.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-installer, build-android]
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pewcast-linux-x86_64
            pewcast-linux-x86_64.tar.gz
            pewcast-windows-x86_64.exe
            pewcast-setup.exe
            pewcast-android.apk
          generate_release_notes: true
